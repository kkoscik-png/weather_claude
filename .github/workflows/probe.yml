name: probe
on: { push: { branches: [probe-fcoo] } }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash {0}
        run: |
          out=probe-out.txt; : > $out
          date -u >> $out
          for p in "21.576607 57.398842" "17.979752 58.939033" "18.542647 54.533221"; do
            set -- $p
            echo "==== snow1g $1 $2" >> $out
            curl -gs "https://opendata-download-metfcst.smhi.se/api/category/snow1g/version/1/geotype/point/lon/$1/lat/$2/data.json" | python3 -c "import sys,json;d=json.load(sys.stdin);print('ref',d.get('referenceTime'),'created',d.get('createdTime'));ts=d['timeSeries'];print('n',len(ts),'first',ts[0]['time'],ts[0].get('intervalParametersStartTime'),'second',ts[1]['time']);print(sorted(ts[0]['data'].keys()))" >> $out 2>&1
            echo "==== mesan2g $1 $2" >> $out
            curl -gs -w ' HTTP%{http_code}' "https://opendata-download-metanalys.smhi.se/api/category/mesan2g/version/1/geotype/point/lon/$1/lat/$2/data.json" > m.json
            tail -c 20 m.json >> $out; echo >> $out
            python3 -c "import json;t=open('m.json').read();t=t[:t.rfind(' HTTP')];d=json.loads(t);print(sorted(d.keys()));ts=d.get('timeSeries',[]);print('n',len(ts),'first',ts and ts[0]['time'],'last',ts and ts[-1]['time']);print(ts and json.dumps(ts[-1])[:900])" >> $out 2>&1
          done
          git config user.name probe; git config user.email probe@example.com
          git add $out; git commit -m "probe output"; git push
