name: probe
on: push
permissions:
  contents: write
jobs:
  probe:
    if: "!contains(github.event.head_commit.message, 'probe output')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash {0}
        run: |
          {
          P="latitude=57.3988,58.939,54.5332,56.1655,57.4076&longitude=21.5766,17.9798,18.5426,15.6289,21.5256&hourly=wind_speed_10m,wind_gusts_10m,wind_direction_10m,cloud_cover,cloud_cover_low,precipitation,temperature_2m&wind_speed_unit=ms&forecast_hours=2&timeformat=unixtime"
          for m in metno_nordic metno_seamless icon_d2 dwd_icon_d2 dmi_harmonie_arome_europe; do echo "==== $m"; curl -gs "https://api.open-meteo.com/v1/forecast?$P&models=$m" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if isinstance(d,dict) and d.get('error'): print('ERROR',d.get('reason'));sys.exit()
          for r in (d if isinstance(d,list) else [d]):
              h=r['hourly'];print(r['latitude'],r['longitude'],{k:h[k][:2] for k in h if k!='time'})
          "; done
          for id in metno_nordic_pp dwd_icon_d2 dmi_harmonie_arome_europe; do echo "==== meta $id"; curl -gs "https://api.open-meteo.com/data/$id/static/meta.json" | head -c 300; echo; done
          echo "==== FMI harmonie"
          for ll in 57.3988,21.5766 54.5332,18.5426 56.1655,15.6289; do curl -gs "https://opendata.fmi.fi/wfs?service=WFS&version=2.0.0&request=getFeature&storedquery_id=fmi::forecast::harmonie::surface::point::timevaluepair&parameters=WindSpeedMS,WindGust,WindDirection,Temperature,TotalCloudCover,LowCloudCover,MediumCloudCover,HighCloudCover,Precipitation1h&latlon=$ll&timestep=60" > fmi.xml; echo "-- $ll size $(wc -c < fmi.xml)"; grep -o '<gml:pos>[^<]*' fmi.xml | head -2; grep -o 'param=[A-Za-z0-9]*' fmi.xml | sort -u | head -12; grep -o '<wml2:value>[^<]*' fmi.xml | head -3; grep -o 'ExceptionText>[^<]*' fmi.xml | head -2; grep -o '<om:resultTime>.\{0,200\}' fmi.xml | head -1; done
          head -c 1500 fmi.xml
          } > probe-out.txt 2>&1
          git config user.name probe; git config user.email probe@example.com
          git add probe-out.txt; git commit -m 'probe output'; git push
