name: fcoo-probe
on: push
permissions:
  contents: write
jobs:
  probe:
    if: "!contains(github.event.head_commit.message, 'probe output')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash {0}
        run: |
          {
          B=https://data.fcoo.dk/webmap/v2/data/NETCDF/FCOO/WW3/
          RUN=$(curl -gs $B | grep -o 'ww3c_NSBALT3NM_[0-9]\{10\}\.nc' | sort -u | tail -1)
          echo "RUN=$RUN"
          curl -gs $B | grep -o '<tr>.*ww3c_NSBALT3NM.*</tr>' | tail -2
          curl -gs $B | grep -A2 "$RUN" | head -8
          F=$B$RUN
          echo ==== NORVIK; curl -gs "$F.ascii?u_v[0:1:0][205:1:210][262:1:267],u[0:1:0][205:1:210][262:1:267],v[0:1:0][205:1:210][262:1:267]" | sed -n '/^u_v.u_v/,/^u_v.time/p;/^u.u/,/^u.time/p;/^v.v/,/^v.time/p;/latc$/,/^$/p;/lonc$/,/^$/p'
          echo ==== GOTLAND; curl -gs "$F.ascii?u[0:6:12][170:1:170][250:1:250],v[0:6:12][170:1:170][250:1:250],u_v[0:6:12][170:1:170][250:1:250]" | grep -E '^\[|\.(u|v|u_v)$|latc|lonc'
          echo ==== FULLPOINT; curl -gs -o fp.txt -w "%{http_code} %{size_download} %{time_total}\n" "$F.ascii?u_v[0:1:55][175:1:179][305:1:309],u[0:1:55][175:1:179][305:1:309],v[0:1:55][175:1:179][305:1:309],TMN[0:1:55][175:1:179][305:1:309]"
          curl -gs -o fp2.txt -w "%{http_code} %{size_download} %{time_total}\n" "$F.ascii?u_v[0:1:55][170:1:170][250:1:250],u[0:1:55][170:1:170][250:1:250],v[0:1:55][170:1:170][250:1:250],TMN[0:1:55][170:1:170][250:1:250]"
          echo ==== OM; curl -gs "https://marine-api.open-meteo.com/v1/marine?latitude=56.04167,57.39,58.94&longitude=16.7639,21.53,17.98&hourly=wave_height,wave_direction&models=ecmwf_wam&start_hour=2026-10-19T05:00&end_hour=2026-10-19T17:00&cell_selection=sea" | grep -o '"hourly":{[^}]*}'
          echo ==== FILES; curl -gs $B | grep -o 'ww3c_NSBALT3NM_[0-9]*\.nc</a>' | sort -u; curl -gs $B | grep -A12 'ww3c_NSBALT3NM_2026101906.nc.html' | grep -i 'td' | head
          } > probe-out.txt 2>&1
          git config user.name probe; git config user.email probe@example.com
          git add probe-out.txt; git commit -m 'probe output'; git push
