name: fcoo-probe
on: push
permissions:
  contents: write
jobs:
  probe:
    if: "!contains(github.event.head_commit.message, 'probe output')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash {0}
        run: |
          {
          B=https://data.fcoo.dk/webmap/v2/data/NETCDF/FCOO/WW3/
          sleep 150
          for g in ports route wave-grid coast; do echo "==== $g"; curl -gs -w "\nHTTP %{http_code} %{time_total}s\n" "https://weather.seasync.co/api/forecast?model=fcoo_ww3&group=$g" | head -c 2500; echo; done
          echo ==== updates; curl -gs "https://weather.seasync.co/api/model-updates?model=fcoo_ww3"
          echo; echo ==== ecmwf; curl -gs "https://weather.seasync.co/api/forecast?model=fcoo_ww3&group=ports" | python3 -c "
          import json,sys,time
          d=json.load(sys.stdin)
          for r in d['records']:
              h=r['hourly'];print(r['id'],r['latitude'],r['longitude'],'n=',sum(v is not None for v in h['wave_height']))
              for k in range(0,60,6): print('  ',time.strftime('%d %H:%M',time.gmtime(h['time'][k])),h['wave_height'][k],h['wave_direction'][k],h['wave_period'][k])
          "
          curl -gs "https://marine-api.open-meteo.com/v1/marine?latitude=57.407578,57.398842,58.939033&longitude=21.525557,21.576607,17.979752&hourly=wave_height,wave_direction,wave_period&models=ecmwf_wam&forecast_hours=60&cell_selection=sea" | python3 -c "
          import json,sys
          for r in json.load(sys.stdin):
              h=r['hourly'];print(r['latitude'],r['longitude'])
              for k in range(0,60,6): print('  ',h['time'][k],h['wave_height'][k],h['wave_direction'][k],h['wave_period'][k])
          "
          } > probe-out.txt 2>&1
          git config user.name probe; git config user.email probe@example.com
          git add probe-out.txt; git commit -m 'probe output'; git push
