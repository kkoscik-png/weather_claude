name: fcoo-probe
on: push
permissions:
  contents: write
jobs:
  probe:
    if: "!contains(github.event.head_commit.message, 'probe output')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          {
          B=https://data.fcoo.dk/webmap/v2/data/NETCDF/FCOO/WW3/
          RUN=$(curl -s $B | grep -o 'ww3c_NSBALT3NM_[0-9]\{10\}\.nc' | sort -u | tail -1)
          echo "RUN=$RUN"
          curl -s $B | grep -o '<tr>.*ww3c_NSBALT3NM.*</tr>' | tail -2
          curl -s $B | grep -A2 "$RUN" | head -8
          F=$B$RUN
          echo ==== DAS; curl -s "$F.das"
          echo ==== DDS; curl -s "$F.dds"
          echo ==== TIME; curl -s "$F.ascii?time[0:1:3]"
          echo ==== TINY; curl -s "$F.ascii?u_v[0:1:1][177:1:178][307:1:308],u[0:1:0][177:1:178][307:1:308],v[0:1:0][177:1:178][307:1:308],TMN[0:1:0][177:1:178][307:1:308]"
          echo ==== TINY-ARRAY; curl -s "$F.ascii?u_v.u_v[0:1:1][177:1:178][307:1:308]"
          echo ==== MULTI; curl -s "$F.ascii?u_v.u_v[0:1:0][177:1:177][307:1:307],u_v.u_v[0:1:0][208:1:208][264:1:264]"
          echo ==== LAT; curl -s "$F.ascii?latc[175:1:179]"; curl -s "$F.ascii?lonc[305:1:309]"
          echo ==== BIG; /usr/bin/time -f "%e s" curl -s -o big.txt -w "%{http_code} %{size_download} %{time_total}\n" "$F.ascii?u_v.u_v[0:1:55][175:1:179][305:1:309]"; head -c 400 big.txt
          echo; echo ==== DODS; curl -s -o d.bin -w "%{http_code} %{size_download} %{time_total}\n" "$F.dods?u_v.u_v[0:1:1][177:1:178][307:1:308]"; xxd d.bin | tail -8
          echo ==== GRID-HEAD; curl -sI "$F" | head -12
          echo ==== OPENMETEO; curl -s "https://marine-api.open-meteo.com/v1/marine?latitude=57.39,58.94&longitude=21.53,17.98&hourly=wave_height,wave_direction&models=ecmwf_wam&forecast_hours=6&cell_selection=sea" | head -c 1500
          echo; echo ==== NORVIK; curl -s "$F.ascii?u_v.u_v[0:1:0][205:1:210][262:1:267],u.u[0:1:0][205:1:210][262:1:267],v.v[0:1:0][205:1:210][262:1:267]"
          } > probe-out.txt 2>&1
          git config user.name probe; git config user.email probe@example.com
          git add probe-out.txt; git commit -m 'probe output'; git push
